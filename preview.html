<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Aadhaar Preview</title>

<link rel="stylesheet" href="css/preview.css">

</head>

<body>

<div class="container">

    <div class="cards">

        <img id="frontPreview" class="aadhaar" alt="Front Aadhaar">

        <img id="backPreview" class="aadhaar" alt="Back Aadhaar">

    </div>

    <div class="buttons">

        <div id="enhanceStatus"></div>

        <button id="backBtn">
            ← Back
        </button>

        <button id="printBtn">
        🖨 Print Document
        </button>
    </div>

</div>

<script src="js/preview.js"></script>

</body>

</html>
