<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Crop Aadhaar Images</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css">

<link rel="stylesheet"
href="css/crop.css">

</head>

<body>

<div class="container">

<div class="title">

<h1>Crop Aadhaar Images</h1>

<p>Drag mouse to crop image</p>

</div>

<div class="image-area">

<div class="crop-box">

<h2>Front Side</h2>

<div class="image-wrapper">

<img
id="cropFront"
src=""
alt="Front Image">

</div>

</div>

<div class="crop-box">

<h2>Back Side</h2>

<div class="image-wrapper">

<img
id="cropBack"
src=""
alt="Back Image">

</div>

</div>

</div>

<div class="tools">

    <button id="rotateLeft">
        ⟲ Rotate Left
    </button>

    <button id="rotateRight">
        ⟳ Rotate Right
    </button>

    <button id="zoomIn">
        ＋ Zoom
    </button>

    <button id="zoomOut">
        － Zoom
    </button>

    <button id="enhanceBtn">
        ✨ Enhance
    </button>

    <button id="nextBtn">
        Continue →
    </button>

</div>

</div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>

<script src="js/crop.js"></script>

</body>

</html>
